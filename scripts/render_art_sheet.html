<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Hand-Drawn Scrapbook Art Sheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 3200px;
      height: 2400px;
      overflow: hidden;
      background: #FFFFFF;
    }
    body.bg-black { background: #000000; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 800px);
      grid-template-rows: repeat(3, 800px);
      width: 3200px;
      height: 2400px;
    }
    .cell {
      width: 800px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .cell svg {
      width: 740px;
      height: 740px;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Shared hand-drawn colored-pencil & crayon SVG filters and textures -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Subtle pencil outline wobble -->
      <filter id="pencil-wobble" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="11" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- Heavy waxy crayon edge wobble for number_23 -->
      <filter id="crayon-wobble" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- Watercolor soft edge -->
      <filter id="wc-soft" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="19" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>

      <!-- Diagonal colored-pencil shading pattern -->
      <pattern id="pencil-hatch-blue" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
        <rect width="12" height="12" fill="#4672A8" fill-opacity="0.72" />
        <line x1="0" y1="2" x2="12" y2="2" stroke="#2D5284" stroke-width="2.2" stroke-opacity="0.45" />
        <line x1="0" y1="7" x2="12" y2="7" stroke="#8FB2DB" stroke-width="1.6" stroke-opacity="0.55" />
        <line x1="0" y1="10" x2="12" y2="10" stroke="#365D8F" stroke-width="1.2" stroke-opacity="0.35" />
      </pattern>
      <pattern id="pencil-hatch-light-blue" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
        <rect width="10" height="10" fill="#89A8CE" fill-opacity="0.75" />
        <line x1="0" y1="2" x2="10" y2="2" stroke="#5D82B4" stroke-width="1.8" stroke-opacity="0.42" />
        <line x1="0" y1="6" x2="10" y2="6" stroke="#D5E3F4" stroke-width="1.6" stroke-opacity="0.65" />
      </pattern>
      <pattern id="pencil-hatch-purple" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
        <rect width="12" height="12" fill="#B86CA8" />
        <line x1="0" y1="3" x2="12" y2="3" stroke="#964986" stroke-width="2.4" stroke-opacity="0.4" />
        <line x1="0" y1="8" x2="12" y2="8" stroke="#D998CB" stroke-width="1.8" stroke-opacity="0.45" />
      </pattern>
      <pattern id="pencil-hatch-green" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
        <rect width="10" height="10" fill="#2A9D58" />
        <line x1="0" y1="2" x2="10" y2="2" stroke="#1B753E" stroke-width="1.8" stroke-opacity="0.42" />
        <line x1="0" y1="7" x2="10" y2="7" stroke="#53C17D" stroke-width="1.3" stroke-opacity="0.38" />
      </pattern>
      <pattern id="pencil-hatch-pink" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
        <rect width="12" height="12" fill="#F4A3B4" />
        <line x1="0" y1="3" x2="12" y2="3" stroke="#DE7A90" stroke-width="1.8" stroke-opacity="0.36" />
        <line x1="0" y1="8" x2="12" y2="8" stroke="#FACAD5" stroke-width="1.6" stroke-opacity="0.48" />
      </pattern>
      <pattern id="pencil-grain-warm" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
        <line x1="0" y1="3" x2="14" y2="3" stroke="#C7B29A" stroke-width="1.1" stroke-opacity="0.28" />
        <line x1="0" y1="9" x2="14" y2="9" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.4" />
      </pattern>

      <!-- Gradients -->
      <linearGradient id="cream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFDF8" />
        <stop offset="35%" stop-color="#FAF2E2" />
        <stop offset="72%" stop-color="#F2E4CE" />
        <stop offset="100%" stop-color="#DFCCB2" />
      </linearGradient>
      <linearGradient id="cream-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="55%" stop-color="#FBF5EA" />
        <stop offset="100%" stop-color="#EDE0CB" />
      </linearGradient>
      <linearGradient id="navy-wc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4A74AA" />
        <stop offset="55%" stop-color="#355B8C" />
        <stop offset="100%" stop-color="#25426B" />
      </linearGradient>
      <linearGradient id="beer-amber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCE072" stop-opacity="0.92" />
        <stop offset="55%" stop-color="#E7A628" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#C67814" stop-opacity="0.96" />
      </linearGradient>
      <linearGradient id="cam-body" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4A4540" />
        <stop offset="55%" stop-color="#35312D" />
        <stop offset="100%" stop-color="#221F1C" />
      </linearGradient>
      <linearGradient id="cam-beige" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F2EAE0" />
        <stop offset="100%" stop-color="#D7CBBC" />
      </linearGradient>
      <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCE072" />
        <stop offset="50%" stop-color="#F0B537" />
        <stop offset="100%" stop-color="#C9891B" />
      </linearGradient>
    </defs>
  </svg>

  <div class="grid">
    <!-- 0: number_23 -->
    <div class="cell" id="cell-number_23">
      <svg viewBox="0 0 400 400">
        <!-- Digit 2: chunky cobalt crayon -->
        <g filter="url(#crayon-wobble)" transform="translate(-8, 12)">
          <path d="M56 126 C58 72, 118 46, 162 66 C198 84, 202 138, 174 178 C148 214, 96 250, 74 282 L188 282 L192 330 L34 330 C34 276, 86 218, 124 176 C144 152, 148 118, 126 104 C104 90, 88 108, 86 136 Z"
            fill="url(#pencil-hatch-blue)" stroke="#244878" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" />
          <!-- Inner crayon paper-grain strokes -->
          <path d="M68 118 C76 80, 126 62, 156 80 C184 96, 182 138, 156 172 C132 204, 86 244, 62 288"
            fill="none" stroke="#DDE9F6" stroke-width="4" stroke-dasharray="14 9 6 12" stroke-linecap="round" opacity="0.65" />
          <path d="M52 312 L176 312" fill="none" stroke="#1E3C66" stroke-width="4" stroke-dasharray="18 8 10 6" stroke-linecap="round" opacity="0.5" />
        </g>
        <!-- Digit 3: lighter denim crayon overlapping slightly -->
        <g filter="url(#crayon-wobble)" transform="translate(8, 6)">
          <path d="M214 102 C232 68, 294 58, 328 86 C356 110, 350 156, 314 178 C356 196, 364 252, 336 290 C306 328, 240 336, 204 306 L222 264 C248 286, 288 284, 302 262 C316 240, 304 206, 266 202 L252 202 L252 162 L268 162 C298 160, 308 134, 294 116 C280 100, 250 106, 238 128 Z"
            fill="url(#pencil-hatch-light-blue)" stroke="#2E5485" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" />
          <path d="M236 96 C268 78, 318 86, 328 118 M236 296 C268 310, 318 296, 326 254"
            fill="none" stroke="#EAF2FB" stroke-width="3.5" stroke-dasharray="12 8" stroke-linecap="round" opacity="0.7" />
          <!-- Cute hand-drawn blue outline star perched on top-right of 3 -->
          <path d="M338 38 L346 56 L366 58 L351 71 L356 91 L338 80 L320 91 L325 71 L310 58 L330 56 Z"
            fill="#DCEAF9" fill-opacity="0.75" stroke="#2D5284" stroke-width="4" stroke-linejoin="round" />
        </g>
      </svg>
    </div>

    <!-- 1: cake_strawberry (simple sketchy colored-pencil two-tier cake matching frames/frame_004.0.jpg) -->
    <div class="cell" id="cell-cake_strawberry">
      <svg viewBox="0 0 400 400">
        <g filter="url(#pencil-wobble)">

          <ellipse cx="200" cy="336" rx="148" ry="26" fill="#FAF4E9" stroke="#7D5D46" stroke-width="3.2" />
          <ellipse cx="200" cy="333" rx="130" ry="18" fill="none" stroke="#D6C2AA" stroke-width="1.8" stroke-dasharray="18 6" />

          <!-- Bottom cake tier: light cream wash + colored pencil strokes -->
          <path d="M78 228 L78 318 C78 338, 322 338, 322 318 L322 228 Z" fill="url(#cream-grad)" stroke="#7D5D46" stroke-width="3.2" stroke-linejoin="round" />
          <path d="M78 228 L78 318 C78 338, 322 338, 322 318 L322 228 Z" fill="url(#pencil-grain-warm)" />
          <!-- Soft pastel pink jam stripe & sketchy frosting swirl -->
          <path d="M79 276 Q140 290 200 280 Q260 290 321 276 L321 288 Q260 302 200 292 Q140 302 79 288 Z" fill="#F4A8B4" fill-opacity="0.58" />
          <path d="M88 258 Q145 270 204 260 Q262 270 310 256" fill="none" stroke="#E2D0B7" stroke-width="2.6" stroke-linecap="round" />
          <ellipse cx="200" cy="228" rx="122" ry="22" fill="url(#cream-top-grad)" stroke="#7D5D46" stroke-width="3" />
          <!-- Simple wavy hand-sketched cream rim -->
          <path d="M80 232 Q104 252 128 236 Q152 256 176 238 Q200 258 224 238 Q248 256 272 236 Q296 252 320 232"
            fill="none" stroke="#A07E62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Lower rim 2 minimalist hand-sketched strawberries -->
          <g transform="translate(88, 206)">
            <path d="M12 3 C20 3, 23 13, 19 21 C15 27, 9 27, 5 21 C1 13, 4 3, 12 3 Z" fill="#E65560" stroke="#7D5D46" stroke-width="2.4" stroke-linejoin="round" />
            <path d="M6 5 L12 1 L18 5 L12 8 Z" fill="#6BB074" stroke="#45784C" stroke-width="1.4" stroke-linejoin="round" />
          </g>
          <g transform="translate(288, 206)">
            <path d="M12 3 C20 3, 23 13, 19 21 C15 27, 9 27, 5 21 C1 13, 4 3, 12 3 Z" fill="#E65560" stroke="#7D5D46" stroke-width="2.4" stroke-linejoin="round" />
            <path d="M6 5 L12 1 L18 5 L12 8 Z" fill="#6BB074" stroke="#45784C" stroke-width="1.4" stroke-linejoin="round" />
          </g>

          <!-- Top tier: simple sketchy cylinder + open center top ellipse for candles -->
          <path d="M114 136 L114 218 C114 234, 286 234, 286 218 L286 136 Z" fill="url(#cream-grad)" stroke="#7D5D46" stroke-width="3.2" stroke-linejoin="round" />
          <path d="M114 136 L114 218 C114 234, 286 234, 286 218 L286 136 Z" fill="url(#pencil-grain-warm)" />
          <ellipse cx="200" cy="136" rx="86" ry="18" fill="url(#cream-top-grad)" stroke="#7D5D46" stroke-width="3" />
          <!-- Simple wavy hand-sketched frosting drip line -->
          <path d="M116 142 Q136 164 156 146 Q178 168 200 148 Q222 168 244 146 Q264 164 284 142"
            fill="none" stroke="#A07E62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Upper rim 2 minimalist hand-sketched strawberries (leaving center clear for 5 candles) -->
          <g transform="translate(120, 114)">
            <path d="M11 3 C18 3, 21 12, 17 19 C13 24, 9 24, 5 19 C1 12, 4 3, 11 3 Z" fill="#E65560" stroke="#7D5D46" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M5 4 L11 1 L17 4 L11 7 Z" fill="#6BB074" stroke="#45784C" stroke-width="1.4" stroke-linejoin="round" />
          </g>
          <g transform="translate(258, 114)">
            <path d="M11 3 C18 3, 21 12, 17 19 C13 24, 9 24, 5 19 C1 12, 4 3, 11 3 Z" fill="#E65560" stroke="#7D5D46" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M5 4 L11 1 L17 4 L11 7 Z" fill="#6BB074" stroke="#45784C" stroke-width="1.4" stroke-linejoin="round" />
          </g>

          <!-- Light hand-drawn colored-pencil sprinkles & dots -->
          <line x1="154" y1="184" x2="162" y2="190" stroke="#E3535D" stroke-width="3.2" stroke-linecap="round" />
          <line x1="202" y1="194" x2="210" y2="188" stroke="#5B97CF" stroke-width="3.2" stroke-linecap="round" />
          <line x1="242" y1="182" x2="249" y2="189" stroke="#F0B94A" stroke-width="3.2" stroke-linecap="round" />
          <circle cx="178" cy="204" r="3.2" fill="#6BB074" />
          <circle cx="226" cy="202" r="3.2" fill="#E3535D" />
          <line x1="126" y1="298" x2="136" y2="304" stroke="#F0B94A" stroke-width="3.4" stroke-linecap="round" />
          <line x1="194" y1="310" x2="206" y2="307" stroke="#E3535D" stroke-width="3.4" stroke-linecap="round" />
          <line x1="258" y1="298" x2="266" y2="306" stroke="#5B97CF" stroke-width="3.4" stroke-linecap="round" />
          <circle cx="160" cy="306" r="3.4" fill="#6BB074" />
          <circle cx="232" cy="308" r="3.4" fill="#F0B94A" />
        </g>
      </svg>
    </div>

    <!-- 2: hat_blue_stripes -->
    <div class="cell" id="cell-hat_blue_stripes">
      <svg viewBox="0 0 400 400">
        <defs>
          <clipPath id="cone-clip-blue">
            <path d="M200 72 L96 320 Q200 348 304 320 Z" />
          </clipPath>
        </defs>
        <g filter="url(#pencil-wobble)">
          <!-- Hat cone base (cream-white watercolor paper) -->
          <path d="M200 72 L96 320 Q200 348 304 320 Z" fill="url(#cream-top-grad)" stroke="#3B5378" stroke-width="4.5" stroke-linejoin="round" />
          <!-- Diagonal navy watercolor stripes + colored pencil hatching -->
          <g clip-path="url(#cone-clip-blue)">
            <path d="M70 110 L320 65 L320 96 L70 142 Z" fill="url(#navy-wc-grad)" />
            <path d="M70 175 L320 130 L320 162 L70 208 Z" fill="url(#navy-wc-grad)" />
            <path d="M70 240 L320 195 L320 227 L70 273 Z" fill="url(#navy-wc-grad)" />

          <path d="M90 318 Q106 336 122 324 Q140 342 158 328 Q178 346 200 330 Q222 346 242 328 Q260 342 278 324 Q294 336 310 318"
            fill="#FFFDF8" stroke="#6E5D4F" stroke-width="3.5" stroke-linecap="round" />
          <!-- Fluffy golden-yellow yarn pom-pom on top -->
          <g fill="#F4C446" stroke="#9B6E18" stroke-width="3">
            <circle cx="200" cy="58" r="21" />
            <circle cx="185" cy="54" r="11" stroke="none" fill="#FCE07E" />
            <circle cx="214" cy="56" r="10" stroke="none" fill="#E3AB2C" />
            <circle cx="200" cy="43" r="11" stroke="none" fill="#FCE07E" />
            <circle cx="200" cy="58" r="21" fill="none" />
          </g>
        </g>
      </svg>
    </div>

    <!-- 3: polaroid_camera -->
    <div class="cell" id="cell-polaroid_camera">
      <svg viewBox="0 0 400 400">
        <g filter="url(#pencil-wobble)">
          <!-- Lower base slab -->
          <path d="M64 218 L108 178 L314 198 L338 240 L270 338 L52 298 Z" fill="url(#cam-body)" stroke="#1D1A18" stroke-width="4.2" stroke-linejoin="round" />
          <!-- Cream front lip / ejection slot -->
          <path d="M52 298 L270 338 L294 300 L72 264 Z" fill="url(#cam-beige)" stroke="#2F2B27" stroke-width="3.8" stroke-linejoin="round" />
          <path d="M74 282 L254 314 L250 324 L70 292 Z" fill="#23201D" />
          <!-- Top dark hood body -->
          <path d="M98 76 L326 94 L314 198 L88 178 Z" fill="#3D3935" stroke="#1D1A18" stroke-width="4.2" stroke-linejoin="round" />
          <!-- Top folded flash housing -->
          <path d="M108 56 L340 72 L326 116 L98 96 Z" fill="#2B2825" stroke="#1D1A18" stroke-width="4" stroke-linejoin="round" />
          <!-- Rainbow stripes across front left -->
          <g stroke-width="4.2">
            <line x1="100" y1="184" x2="210" y2="195" stroke="#E04B44" />
            <line x1="98" y1="189" x2="208" y2="200" stroke="#F09432" />
            <line x1="96" y1="194" x2="206" y2="205" stroke="#F2D249" />
            <line x1="94" y1="199" x2="204" y2="210" stroke="#4CA66B" />
            <line x1="92" y1="204" x2="202" y2="215" stroke="#3D82C4" />
          </g>
          <!-- Flash diffuser window (top right) -->
          <rect x="234" y="76" width="84" height="44" rx="5" transform="rotate(5 276 98)" fill="#EEDBC2" stroke="#2A2622" stroke-width="3" />
          <g stroke="#B89F81" stroke-width="1.8" opacity="0.75">
            <line x1="250" y1="77" x2="246" y2="117" /><line x1="265" y1="78" x2="261" y2="118" />
            <line x1="280" y1="79" x2="276" y2="119" /><line x1="295" y1="80" x2="291" y2="120" />
            <line x1="308" y1="81" x2="304" y2="121" />
          </g>
          <!-- Main round lens barrel -->
          <circle cx="196" cy="144" r="40" fill="#23211E" stroke="#141210" stroke-width="4" />
          <circle cx="196" cy="144" r="29" fill="#3B3937" stroke="#6B655E" stroke-width="2" />
          <circle cx="196" cy="144" r="19" fill="#17191E" />
          <ellipse cx="189" cy="137" rx="7" ry="4" transform="rotate(-30 189 137)" fill="#9EC8EB" fill-opacity="0.7" />
          <circle cx="204" cy="152" r="3.5" fill="#F2D7A8" fill-opacity="0.6" />
          <!-- Viewfinder window -->
          <rect x="254" y="138" width="38" height="36" rx="4" transform="rotate(4 273 156)" fill="#1D2228" stroke="#5A554E" stroke-width="3" />
          <line x1="260" y1="145" x2="282" y2="168" stroke="#85A7C4" stroke-width="2" opacity="0.55" />
          <!-- Red shutter button (left lower corner) -->
          <circle cx="94" cy="246" r="14" fill="#D4433B" stroke="#6E1E1A" stroke-width="3" />
          <circle cx="91" cy="242" r="4" fill="#F68D87" fill-opacity="0.7" />

          <text x="116" y="130" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#EDE4D8" transform="rotate(4 116 130)">One</text>
          <text x="112" y="148" font-family="Georgia, serif" font-weight="bold" font-size="16" fill="#EDE4D8" transform="rotate(4 112 148)">Step</text>
        </g>
      </svg>
    </div>

    <!-- 4: hat_pink_dots -->
    <div class="cell" id="cell-hat_pink_dots">
      <svg viewBox="0 0 400 400">
        <defs>
          <clipPath id="cone-clip-pink">

        <g filter="url(#pencil-wobble)">

            <path d="M225 72 L308 328 L258 334 Z" fill="#8C3148" fill-opacity="0.14" />

          <path d="M200 72 L96 320 Q200 348 304 320 Z" fill="none" stroke="#9C455C" stroke-width="4.2" stroke-linejoin="round" />
          <!-- Scalloped trim -->
          <path d="M90 318 Q106 336 122 324 Q140 342 158 328 Q178 346 200 330 Q222 346 242 328 Q260 342 278 324 Q294 336 310 318"

          <!-- Fluffy cream pom-pom -->
          <g fill="#FFF7E2" stroke="#B58969" stroke-width="3">
            <circle cx="200" cy="58" r="21" />
            <circle cx="186" cy="52" r="10" stroke="none" fill="#FFFFFF" />
            <circle cx="212" cy="60" r="10" stroke="none" fill="#F5E5C0" />
            <circle cx="200" cy="58" r="21" fill="none" />
          </g>
        </g>
      </svg>
    </div>

    <!-- 5: glasses_heart -->
    <div class="cell" id="cell-glasses_heart">
      <svg viewBox="0 0 400 400">
        <g filter="url(#pencil-wobble)">
          <!-- Bridge -->
          <path d="M174 176 Q200 156 226 176" fill="none" stroke="#D1456C" stroke-width="11" stroke-linecap="round" />
          <!-- Left heart frame -->
          <path d="M114 274 C60 232, 34 188, 38 148 C42 114, 72 96, 102 108 C118 114, 128 128, 134 138 C142 122, 160 112, 180 120 C206 130, 210 166, 194 202 C178 238, 138 264, 114 274 Z"
